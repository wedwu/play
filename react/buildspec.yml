version: 0.2

# Environment variables injected by CodePipeline per action:
#   ENVIRONMENT       — vite mode: development | staging | production
#   S3_BUCKET         — target S3 bucket name
#   CF_DISTRIBUTION_ID — CloudFront distribution ID for cache invalidation

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm ci

  pre_build:
    commands:
      - npm run lint

  build:
    commands:
      - npm run build:$ENVIRONMENT

  post_build:
    commands:
      # Sync hashed assets with long-lived cache (content-addressed, safe to cache forever)
      - aws s3 sync dist/ s3://$S3_BUCKET --delete --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
      # Upload index.html with no-cache so browsers always fetch the latest entry point
      - aws s3 cp dist/index.html s3://$S3_BUCKET/index.html --cache-control "no-cache,no-store,must-revalidate"
      # Invalidate CloudFront so edge caches serve the new index.html immediately
      - aws cloudfront create-invalidation --distribution-id $CF_DISTRIBUTION_ID --paths "/*"
      - echo "Deployed $ENVIRONMENT -> s3://$S3_BUCKET"
